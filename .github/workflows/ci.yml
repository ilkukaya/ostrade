name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege by default; this workflow only reads the repo and never
# needs to write anything (no deploy step, no PR comments).
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    # Deliberately no `secrets.*` anywhere in this workflow — the production
    # build must succeed with zero market-data/auth/database credentials
    # (see docs/market-data.md, docs/deployment-netlify.md), so CI proves
    # exactly that instead of relying on secrets that would otherwise be
    # unavailable to a pull_request run from a fork anyway.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
